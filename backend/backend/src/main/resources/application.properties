spring.application.name=backend
server.port=8082

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties],optional:file:backend/backend/.env[.properties]

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexorcrm}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:4658}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false

# Bootstrap Super Admin
bootstrap.enabled=${BOOTSTRAP_ENABLED:true}
bootstrap.superadmin.username=${BOOTSTRAP_SUPERADMIN_USERNAME:}
bootstrap.superadmin.email=${BOOTSTRAP_SUPERADMIN_EMAIL:}
bootstrap.superadmin.password=${BOOTSTRAP_SUPERADMIN_PASSWORD:}

# JWT
security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Frontend
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-part-count=300

# Mail (set via env vars)
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from-address=${MAIL_FROM_ADDRESS:}
app.mail.from-name=${MAIL_FROM_NAME:SVL}
app.mail.cooldown-minutes=${MAIL_COOLDOWN_MINUTES:60}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Employee public profile form
app.employee-form.token-secret=${EMPLOYEE_FORM_TOKEN_SECRET:change-me}
app.employee-form.token-ttl-days=${EMPLOYEE_FORM_TOKEN_TTL_DAYS:7}
app.employee-form.public-base-url=${EMPLOYEE_FORM_PUBLIC_BASE_URL:https://erp.svlpackaging.com/employee-form}
app.employee-form.required-fields=${EMPLOYEE_FORM_REQUIRED_FIELDS:DATE_OF_BIRTH,GENDER,CURRENT_ADDRESS,AADHAAR_NUMBER,PAN_NUMBER,BANK_ACCOUNT_HOLDER_NAME,BANK_ACCOUNT_NUMBER,BANK_IFSC,BANK_NAME_BRANCH}
app.employee-form.required-docs=${EMPLOYEE_FORM_REQUIRED_DOCS:PHOTO,RESUME}

# Recovery
recovery.enabled=${RECOVERY_ENABLED:false}
recovery.secret.token=${RECOVERY_SECRET_TOKEN:nexorcrm_recovery_secret_token_xyz}

# Refresh Cookie
auth.access-token.expiry-minutes=${ACCESS_TOKEN_EXPIRY_MINUTES:60}
auth.refresh-token.expiry-days=${REFRESH_TOKEN_EXPIRY_DAYS:1}
auth.refresh-cookie.name=${REFRESH_COOKIE_NAME:refresh_token}
auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}
auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}
auth.refresh-cookie.max-age-days=${REFRESH_COOKIE_MAX_AGE_DAYS:30}
logging.level.com.nexorcrm.backend.service.LeadService=INFO

# Meta Lead Ads Integration Settings
meta.verify-token=${META_VERIFY_TOKEN:svl_crm_secret}
meta.page-access-token=${META_PAGE_ACCESS_TOKEN:PLACEHOLDER}
meta.app-secret=${META_APP_SECRET:PLACEHOLDER}

